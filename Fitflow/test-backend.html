<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1f2e;
            color: #fff;
        }
        .test-section {
            background: #2d3548;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #3a7bc8;
        }
        .result {
            background: #1a1f2e;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success { color: #3ecf8e; }
        .error { color: #ff6b6b; }
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #1a1f2e;
            border: 1px solid #4a5568;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🔧 FitFlow Backend API Tester</h1>
    
    <div class="test-section">
        <h2>1. Test Backend Connectivity</h2>
        <button onclick="testConnection()">Test Connection</button>
        <div id="connection-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. Test Login Endpoint</h2>
        <input type="text" id="username" placeholder="Username" value="testuser">
        <input type="password" id="password" placeholder="Password" value="password123">
        <button onclick="testLogin()">Test Login</button>
        <div id="login-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. Test Register Endpoint</h2>
        <input type="text" id="reg-username" placeholder="Username" value="newuser">
        <input type="email" id="reg-email" placeholder="Email" value="newuser@example.com">
        <input type="password" id="reg-password" placeholder="Password" value="password123">
        <button onclick="testRegister()">Test Register</button>
        <div id="register-result" class="result"></div>
    </div>

    <script>
        const API_BASE_URL = 'https://fitflow-backend-cygw.onrender.com/api';

        function displayResult(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = isError ? 'result error' : 'result success';
        }

        async function testConnection() {
            displayResult('connection-result', '⏳ Testing connection...');
            
            try {
                const response = await fetch(`${API_BASE_URL}/health`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displayResult('connection-result', 
                        `✅ Backend is reachable!\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`
                    );
                } else {
                    displayResult('connection-result', 
                        `⚠️ Backend responded but with error\nStatus: ${response.status}\nStatusText: ${response.statusText}`,
                        true
                    );
                }
            } catch (error) {
                displayResult('connection-result', 
                    `❌ Connection failed!\nError: ${error.message}\n\nThis could be:\n1. CORS not configured on backend\n2. Backend is down\n3. Network issue`,
                    true
                );
            }
        }

        async function testLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            displayResult('login-result', '⏳ Testing login...');
            
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResult('login-result', 
                        `✅ Login successful!\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`
                    );
                } else {
                    displayResult('login-result', 
                        `❌ Login failed\nStatus: ${response.status}\nError: ${JSON.stringify(data, null, 2)}`,
                        true
                    );
                }
            } catch (error) {
                displayResult('login-result', 
                    `❌ Request failed!\nError: ${error.message}\n\nPossible causes:\n1. CORS error\n2. Backend endpoint doesn't exist\n3. Network error`,
                    true
                );
            }
        }

        async function testRegister() {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            
            displayResult('register-result', '⏳ Testing registration...');
            
            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResult('register-result', 
                        `✅ Registration successful!\nStatus: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`
                    );
                } else {
                    displayResult('register-result', 
                        `❌ Registration failed\nStatus: ${response.status}\nError: ${JSON.stringify(data, null, 2)}`,
                        true
                    );
                }
            } catch (error) {
                displayResult('register-result', 
                    `❌ Request failed!\nError: ${error.message}`,
                    true
                );
            }
        }

        // Auto-test connection on load
        window.addEventListener('load', () => {
            setTimeout(testConnection, 500);
        });
    </script>
</body>
</html>
